name: sentinel-vision
version: "0.1.0"
manifest_version: 2
api_version: 1
description: "Watch cameras, the screen, for events you describe in plain English. A local change gate filters frames; only changed frames go to a vision model judge, and confirmed events wake the agent."
author: "Nitij Khanal"
license: MIT
tags: [vision, monitoring, camera, screen]
requires_hermes: ">=0.22.5"
python_dependencies:
  - "numpy>=1.26,<3"
  - "opencv-python-headless>=4.8,<6"
  - "mss>=9,<11"
provides_tools:
  - sentinel_sources
  - sentinel_watch
  - sentinel_rules
  - sentinel_update
  - sentinel_look
  - sentinel_events
  - sentinel_feedback
  - sentinel_teach
  - sentinel_setup_check
provides_hooks: []
capabilities: []
config_schema:
  default_source:
    type: str
    default: "camera:0"
    description: "Source used when a request names none: camera:N, screen[:N], rtsp://..., stream:<name>, snapshot:https://..., folder:/path, file:/path/video.mp4."
  vision_calls_per_hour:
    type: int
    default: 60
    description: "Cap on vision-model checks per clock hour, across all rules (0 pauses judging)."
  vision_calls_per_day:
    type: int
    default: 500
    description: "Cap on vision-model checks per rolling 24 hours, across all rules."
  confirm_k:
    type: int
    default: 2
    description: "Positive verdicts needed out of the last confirm_n before a rule fires."
  confirm_n:
    type: int
    default: 3
    description: "Size of the confirmation window (k-of-n)."
  confidence_threshold:
    type: float
    default: 0.7
    description: "Minimum judge confidence (0..1) for a verdict to count as evidence."
  idle_check_seconds:
    type: float
    default: 300
    description: "Re-check condition and absence rules this often even without motion (0 disables). Trigger rules are stretched to at least 6 hours."
  retention_days:
    type: float
    default: 7
    description: "Delete events and snapshots older than this many days."
  max_storage_mb:
    type: float
    default: 500
    description: "Cap on snapshot storage; the oldest photos are pruned first."
  stream_urls:
    type: dict
    default: {}
    description: "Named streams, name -> URL. Put credentials in ${SECRET_NAME} placeholders; they are resolved through the Hermes secret scope, never stored."
  alert_snapshots:
    type: bool
    default: true
    description: "Attach the event photo (MEDIA:) to alerts."
  motion_frames:
    type: int
    default: 3
    description: "Frames (2-3) shown to the vision model, in time order, for rules about movement (walking toward, rising, opening). One call either way; 0 or 1 sends a single still."
  batch_judging:
    type: bool
    default: true
    description: "Judge several rules on the same camera frame in one vision call (one budget unit) instead of one call per rule."
  batch_max_rules:
    type: int
    default: 4
    description: "Most rules judged in one batched vision call (1-8). 1 turns batching off."
  second_opinion:
    type: bool
    default: true
    description: "Re-check a borderline positive verdict once on a higher-resolution crop of the changed region with a differently worded prompt. Costs one budget unit per check."
  second_opinion_band_low:
    type: float
    default: 0.5
    description: "Lower edge of the confidence band (0..1) that earns a second opinion."
  second_opinion_band_high:
    type: float
    default: 0.8
    description: "Upper edge of the band. Verdicts at or above it are trusted without a second look."
  second_opinion_per_hour:
    type: int
    default: 6
    description: "Cap on second opinions per hour across all rules (0 turns them off)."
  rule_min_interval_seconds:
    type: float
    default: 10
    description: "Safety net: least seconds between two judge calls of one rule (0..3600; 0 turns it off). Confirmation looks of a rule already collecting k-of-n evidence are exempt."
  latched_min_interval_seconds:
    type: float
    default: 60
    description: "Safety net: least seconds between two judge calls of a latched rule (fired, cooldown over, waiting for a clear verdict to re-arm; 10..3600). Longer than rule_min_interval_seconds because these looks only detect that the scene cleared."
  rule_calls_per_hour:
    type: int
    default: 30
    description: "Safety net: most judge calls one rule may make per rolling hour (1..1000). When reached the rule keeps its state, you get one notice, and judging resumes as the window frees."
  stream_url_1:
    type: secret
    env: SENTINEL_STREAM_URL_1
    description: "Optional secret slot 1: a full camera URL (credentials included) for use as ${SENTINEL_STREAM_URL_1} in stream_urls or a source. Stored in .env, never in config.yaml."
  stream_url_2:
    type: secret
    env: SENTINEL_STREAM_URL_2
    description: "Optional secret slot 2: a full camera URL (credentials included) for use as ${SENTINEL_STREAM_URL_2} in stream_urls or a source. Stored in .env, never in config.yaml."
  stream_url_3:
    type: secret
    env: SENTINEL_STREAM_URL_3
    description: "Optional secret slot 3: a full camera URL (credentials included) for use as ${SENTINEL_STREAM_URL_3} in stream_urls or a source. Stored in .env, never in config.yaml."
  stream_url_4:
    type: secret
    env: SENTINEL_STREAM_URL_4
    description: "Optional secret slot 4: a full camera URL (credentials included) for use as ${SENTINEL_STREAM_URL_4} in stream_urls or a source. Stored in .env, never in config.yaml."
