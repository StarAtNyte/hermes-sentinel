name: hermes-sentinel
version: "0.1.0"
repo: https://github.com/StarAtNyte/hermes-sentinel
sha: <FILL_40_CHAR_SHA>
subdir: hermes-sentinel
title: Hermes Sentinel
description: "Describe in plain English what to watch for on a webcam, the screen, an RTSP/HTTP stream, a snapshot URL or an image folder; Hermes alerts you with a photo when it happens and remembers what it saw. A local change gate drops quiet frames, only changed frames reach your vision model, verdicts are k-of-n confirmed with hard call caps, and false-alarm feedback tightens the rule. Eight sentinel_* tools, /sentinel, two auxiliary tasks and a Desktop pane. Disclosure: opens local cameras and captures the screen; changed JPEG frames (at most 1024 px) and rule text go to the model you route for sentinel_vision / sentinel_rules via ctx.llm, plus any stream or snapshot URL you supply (${SECRET} values via agent.secret_scope.get_secret). A daemon-thread watcher runs while rules exist and stops on unload. Alerts are injected into your chat with ctx.inject_message; outside the classic CLI that needs plugins.entries.hermes-sentinel.allow_gateway_injection: true, which the plugin never sets. Rules, events and snapshots (7 days, 500 MB cap) stay under HERMES_HOME/plugin-data/hermes-sentinel/. No shell, telemetry, update checks or stored credentials. Not a safety device."
maintainer: StarAtNyte
tier: community
category: automation
requires_hermes: ">=0.22.5"
docs_url: https://github.com/StarAtNyte/hermes-sentinel/blob/<FILL_40_CHAR_SHA>/hermes-sentinel/README.md
platforms: []
readme: true
screenshots:
  - https://raw.githubusercontent.com/StarAtNyte/hermes-sentinel/<FILL_40_CHAR_SHA>/hermes-sentinel/docs/screenshots/alert-telegram.png
  - https://raw.githubusercontent.com/StarAtNyte/hermes-sentinel/<FILL_40_CHAR_SHA>/hermes-sentinel/docs/screenshots/desktop-pane.png
  - https://raw.githubusercontent.com/StarAtNyte/hermes-sentinel/<FILL_40_CHAR_SHA>/hermes-sentinel/docs/screenshots/sentinel-status.png
known_issues:
  - "Outside the classic CLI, alerts are only delivered after you add plugins.entries.hermes-sentinel.allow_gateway_injection: true to config.yaml; /sentinel status shows the exact snippet when delivery is refused."
  - "Needs a vision-capable model routed to the sentinel_vision auxiliary task, otherwise judging fails (the gate keeps running)."
  - "On Telegram/Discord send /sentinel here once so alerts return to that chat."
  - "Screen capture needs a display; it is not available on a headless server."
  - "Frames are judged as single stills (no motion or audio); expect misses and false alarms. Not a safety device."
capabilities:
  provides_tools:
    - sentinel_sources
    - sentinel_watch
    - sentinel_rules
    - sentinel_update
    - sentinel_look
    - sentinel_events
    - sentinel_feedback
    - sentinel_teach
    - sentinel_setup_check
  provides_hooks: []
  provides_middleware: []
  requires_env: []
