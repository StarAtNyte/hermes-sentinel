name: hermes-sentinel
version: "0.1.0"
repo: https://github.com/StarAtNyte/hermes-sentinel
sha: <FILL_40_CHAR_SHA>
subdir: hermes-sentinel
title: Hermes Sentinel
description: "Describe in plain English what to watch for on a webcam, the screen, an RTSP/HTTP stream, a snapshot URL, an image folder or a local video file; Hermes alerts you with a photo when it happens and remembers what it saw. A local change gate (with slow-drift detection) drops quiet frames, only changed frames reach your vision model, movement questions get a short ordered frame sequence, rules on the same frame share one call, borderline hits get a stricter second look, verdicts are k-of-n confirmed with hard call caps, and feedback tunes the rule. Nine sentinel_* tools, /sentinel, two auxiliary tasks and a Desktop pane. Disclosure: opens local cameras, captures the screen and reads video files you point it at; changed JPEG frames (at most 1024 px; up to 3 for movement rules; a crop up to 1536 px for second opinions, an extra vision call capped at 6 per hour) and rule text go to the model you route for sentinel_vision / sentinel_rules via ctx.llm, plus any stream or snapshot URL you supply (${SECRET} values via agent.secret_scope.get_secret, kept only in memory). A daemon-thread watcher runs while rules exist and stops on unload. Alerts are injected into your chat with ctx.inject_message; outside the classic CLI that needs plugins.entries.hermes-sentinel.allow_gateway_injection: true, which the plugin never sets. Rules, events and snapshots (7 days, 500 MB cap) stay under HERMES_HOME/plugin-data/hermes-sentinel/. No shell, telemetry, update checks or stored credentials. Not a safety device."
maintainer: StarAtNyte
tier: community
category: automation
requires_hermes: ">=0.22.5"
docs_url: https://github.com/StarAtNyte/hermes-sentinel/blob/<FILL_40_CHAR_SHA>/hermes-sentinel/README.md
platforms: []
readme: true
screenshots:
  - https://raw.githubusercontent.com/StarAtNyte/hermes-sentinel/<FILL_40_CHAR_SHA>/hermes-sentinel/docs/screenshots/alert-telegram.png
  - https://raw.githubusercontent.com/StarAtNyte/hermes-sentinel/<FILL_40_CHAR_SHA>/hermes-sentinel/docs/screenshots/desktop-pane.png
  - https://raw.githubusercontent.com/StarAtNyte/hermes-sentinel/<FILL_40_CHAR_SHA>/hermes-sentinel/docs/screenshots/sentinel-status.png
known_issues:
  - "Outside the classic CLI, alerts are only delivered after you add plugins.entries.hermes-sentinel.allow_gateway_injection: true to config.yaml; /sentinel status shows the exact snippet when delivery is refused."
  - "Needs a vision-capable model routed to the sentinel_vision auxiliary task, otherwise judging fails (the gate keeps running)."
  - "On Telegram/Discord send /sentinel here once so alerts return to that chat."
  - "Screen capture needs a display; it is not available on a headless server."
  - "Vision only (no audio, no video-site streams such as YouTube). Movement is judged from up to 3 recent frames, not video; the slow-drift check misses very small or very large gradual changes. Expect misses and false alarms. Not a safety device."
  - "Plugins cannot read allow_gateway_injection; run /sentinel setup --test-delivery to test delivery. On a multiplexing gateway, cameras that need a ${SECRET} wait until the first /sentinel command or sentinel_* tool call after start-up."
capabilities:
  provides_tools:
    - sentinel_sources
    - sentinel_watch
    - sentinel_rules
    - sentinel_update
    - sentinel_look
    - sentinel_events
    - sentinel_feedback
    - sentinel_teach
    - sentinel_setup_check
  provides_hooks: []
  provides_middleware: []
  requires_env: []   # matches plugin.yaml (none). The optional SENTINEL_STREAM_URL_1..4 slots are config_schema secrets, not requires_env.
